<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F5F4EF" />
    <title>Campus Pulse | Intelligent Real-Time Operating Layer for Campus Life</title>
    <meta name="author" content="UVERMA" />
    <meta name="creator" content="UVERMA" />
    <meta name="description" content="Ask your campus. See your campus. Navigate your campus. Improve your campus. Campus Pulse provides real-time occupancy tracking, AI space recommendation, wayfinding, faculty availability, and instant issue reporting." />
    <!-- OpenGraph & Social Preview Meta Tags -->
    <meta property="og:title" content="Campus Pulse | Intelligent Real-Time Operating Layer for Campus Life" />
    <meta property="og:description" content="Ask your campus. See your campus. Navigate your campus. Real-time campus telemetry, study spaces, maps, and faculty locator." />
    <meta property="og:image" content="/assets/campus-pulse-logo.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/assets/campus-pulse-logo.png" />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('campuspulse_theme');
          if (stored === 'dark' || (!stored && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <!-- Google Fonts: Syne (Display) & Space Grotesk / Plus Jakarta Sans (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F5F4EF] dark:bg-[#0E0F12] text-[#111111] dark:text-[#F3F3EE] antialiased selection:bg-[#DC2626] selection:text-white overflow-x-hidden font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Self-healing fallback for GitHub Pages branch deployments (e.g. main / root)
      if (typeof window !== 'undefined' && !window.__CAMPUS_PULSE_MOUNTED__ && window.location.hostname.includes('github.io')) {
        var v = 'v=' + Date.now();
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.crossOrigin = 'anonymous';
        link.href = '/Campus-Pulse/assets/index.css?' + v;
        link.onerror = function() {
          this.href = '/Campus-Pulse/public/assets/index.css?' + v;
        };
        document.head.appendChild(link);

        var script = document.createElement('script');
        script.type = 'module';
        script.crossOrigin = 'anonymous';
        script.src = '/Campus-Pulse/assets/index.js?' + v;
        script.onerror = function() {
          var fallback = document.createElement('script');
          fallback.type = 'module';
          fallback.crossOrigin = 'anonymous';
          fallback.src = '/Campus-Pulse/public/assets/index.js?' + v;
          document.body.appendChild(fallback);
        };
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>
